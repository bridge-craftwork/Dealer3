[package]
name = "dealer"
version = "1.0.0"
edition = "2021"
license = "Unlicense"

[dependencies]
dealer-core = { path = "../dealer-core" }
dealer-parser = { path = "../dealer-parser" }
dealer-level = { path = "../dealer-level" }
# `parallel` is what `-R`/`--threads` drives. A terminal has threads to spawn;
# a browser does not yet, which is why the engine keeps it behind a feature.
dealer-run = { path = "../dealer-run", features = ["parallel"] }
dealer-eval = { path = "../dealer-eval" }
dealer-pbn = { path = "../dealer-pbn" }
bridge-encodings = { git = "https://github.com/bridge-craftwork/bridge-encodings" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
# Only the tests parse JSON. The binary writes it by hand rather than taking
# on serde for one switch.
serde_json = "1"

[[bin]]
name = "dealer"
path = "src/main.rs"

[[bin]]
name = "deal-validator"
path = "src/deal_validator.rs"
