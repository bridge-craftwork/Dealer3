name: Pages

on:
  push:
    branches: [main]
    paths:
      # Every workspace crate, by glob rather than by name. The list used to be
      # written out, and it was missing `dealer-run` — the crate that owns the
      # generate loop, and so the one the site depends on most. An engine change
      # would pass CI, merge, and never reach the site; the deploy was not
      # failing, it was not running, which is far quieter. A glob cannot fall
      # behind a crate nobody remembered to add.
      - 'dealer*/**'
      - 'wasm/**'
      - 'web/**'
      # The short-link service (#103). Pages deploys these with the site.
      - 'functions/**'
      - 'Cargo.toml'
      # The levelling guide page inlines this file with `?raw` at build time,
      # so editing the markdown is editing the site. Without this the guide
      # would go stale on the site while looking current in the repo — and
      # nothing would say so.
      - 'docs/leveling-guide.md'
      # The hosting half of the deploy: a change to the headers or the Pages
      # config has to redeploy too, or the site would keep serving the old ones.
      - 'wrangler.jsonc'
      - '.github/workflows/pages.yml'
  # Lets the site be redeployed without a code change.
  workflow_dispatch:

permissions:
  contents: read

# Latest wins: a superseded deploy has nothing worth finishing.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Read here rather than inside the step so a step's `if` can test them.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The site ships the THREADED wasm build, and that needs a nightly with
      # `rust-src`: wasm threads mean atomics and shared memory, which means
      # rebuilding the standard library, which is `-Z build-std`. Everything
      # else here stays on stable.
      #
      # The version is read out of `wasm/build.sh` rather than written again
      # here, because the two must be the same one — `build.sh` explains which
      # nightly and why (wasm-bindgen wants a `__wasm_init_tls` that newer LLVM
      # no longer emits). A bump there moves this with it.
      #
      # Failing here fails the deploy, which is the point: there is no fallback
      # to the single-threaded build, because a deploy that quietly shipped the
      # wrong bundle would look and behave exactly like a working one, four
      # times slower.
      - name: Install the pinned nightly the threaded build needs
        run: |
          set -euo pipefail
          toolchain=$(sed -n 's/^THREADED_TOOLCHAIN=//p' wasm/build.sh)
          test -n "$toolchain" || {
            echo "wasm/build.sh no longer names a THREADED_TOOLCHAIN." >&2
            exit 1
          }
          echo "Threaded build toolchain: $toolchain"
          rustup toolchain install "$toolchain" --profile minimal \
              --component rust-src --target wasm32-unknown-unknown

      # The `wasm-bindgen` BINARY and the `wasm-bindgen` CRATE share a private
      # format and must be the same version, or the build dies at the bindgen
      # step with "a different bindgen format than this binary" — naming neither
      # of the two versions. `build.sh` refuses to guess; this is where the
      # runner gets the right one.
      #
      # The version is resolved from the lockfile rather than written here, so a
      # `cargo update` cannot leave the two disagreeing. Locally `wasm-pack`
      # fetches the matching binary into its own cache and `build.sh` finds it
      # there; a runner has neither, hence this.
      - name: Install the wasm-bindgen that matches the crate
        working-directory: wasm
        run: |
          set -euo pipefail
          cargo generate-lockfile
          version=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"/\1/p;}' Cargo.lock)
          test -n "$version" || {
            echo "Cargo.lock names no wasm-bindgen, so nothing can be matched to it." >&2
            exit 1
          }
          echo "The crate wants wasm-bindgen $version"
          archive="wasm-bindgen-$version-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "$archive/wasm-bindgen"
          wasm-bindgen --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm

      - uses: actions/setup-node@v4
        with:
          # Vite 7 wants 20.19+ or 22.12+; 22 resolves to the latest 22.x.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # PINNED, not `latest`. This action resolves `latest` by asking the
      # GitHub API, and when that call fails it does not fail the step — it
      # silently falls back to its own default, wasm-pack v0.9.1, whose
      # wasm-opt is too old to parse what wasm-bindgen emits. The build then
      # dies with "Only 1 table definition allowed in MVP", which names
      # nothing relevant. pdf-handouts hit exactly that on 2026-09-01.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.15.0'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Before the site build: Vite bundles the generated module as an asset, so
      # it has to exist on disk first.
      #
      # `wasm:threaded`, not `wasm`. The two produce the same deals and the
      # threaded one is about four times faster on a machine with cores to
      # spare; `web/public/_headers` sends the COOP/COEP it needs, which is why
      # this site is on Cloudflare Pages at all.
      - name: Build the WebAssembly bundle (threaded)
        working-directory: web
        run: npm run wasm:threaded

      - name: Run the site tests
        working-directory: web
        run: npm test

      - name: Build the site
        working-directory: web
        run: npm run build

      # The one failure nothing else here can see: a single-threaded bundle
      # works, deals the same deals, and uses one core of twelve. It is read out
      # of the binary — shared memory, and a `start_threads` export — so a
      # reverted script or a stale artefact cannot get past it.
      - name: The shipped bundle is the threaded one
        working-directory: web
        run: npm run check:threaded

      # A missing wasm asset produces a page that loads, shows the editor, and
      # then fails to generate anything — so fail here instead of shipping it.
      - name: Check the bundle landed
        working-directory: web
        run: |
          test -f dist/index.html
          ls dist/assets/*.wasm
          ls dist/assets/*.js
          # _headers is copied verbatim out of public/; without it the COOP/COEP
          # the threaded build needs would silently not be sent, and every run
          # would fall back to one thread.
          test -f dist/_headers
          grep -q 'Cross-Origin-Embedder-Policy' dist/_headers
          grep -q 'Cross-Origin-Opener-Policy' dist/_headers
          du -sh dist

      # Cloudflare Pages is the only host. GitHub Pages was dropped: it cannot
      # send the COOP/COEP headers the threaded wasm build needs, so it would
      # have served a second copy that quietly diverged the moment threading
      # landed — and its deploy job being `needs: build` meant a Cloudflare
      # credential problem blocked it anyway.
      #
      # Cloudflare being the only target makes a silent skip dangerous: the run
      # would go green having deployed nothing. So fail explicitly when the
      # credential is missing here, while still letting a fork build.
      - name: Require the Cloudflare credential
        if: github.repository == 'bridge-craftwork/Dealer3' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set, so the site cannot be deployed." >&2
          echo "The token needs Account -> Cloudflare Pages -> Edit on this account." >&2
          exit 1

      # What the credential can actually see. A deploy failure is otherwise
      # reported as a bare "Authentication error", which is indistinguishable
      # between a wrong account, a missing permission, and a token scoped to
      # some other project.
      - name: Show what the credential can reach
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: npx --yes wrangler@4 pages project list

      # `--commit-dirty` because the checkout carries the generated wasm module,
      # which wrangler would otherwise refuse to deploy from as an unclean tree.
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@4 pages deploy --commit-dirty=true
