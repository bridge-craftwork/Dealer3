name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-git-

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-target-

    - name: Build all crates
      run: cargo build --workspace --verbose

    - name: Run tests
      run: cargo test --workspace

    - name: Build release
      run: cargo build --workspace --release --verbose

    # The double-dummy oracle is the one test whose coverage depends on the
    # profile: a debug build checks a few boards, an optimised build checks the
    # whole fixture. This is where the whole fixture gets checked.
    - name: Check the double-dummy tables against the full fixture
      run: cargo test -p dealer-dds --release

    # `examples/NT_Ladder.leveled.dlr` is generated from the stock file beside
    # it. The measuring run is seeded and stops on the exact deal that finishes
    # the job rather than at a batch boundary, so regenerating reproduces it
    # byte for byte on any number of cores — unless the levelling has changed,
    # which is the point.
    - name: Check the generated example is still what dealer produces
      if: runner.os == 'Linux'
      run: |
        target/release/dealer examples/NT_Ladder.stock.dlr -q -s 1 \
          --write-leveled /tmp/regenerated.dlr
        diff -u examples/NT_Ladder.leveled.dlr /tmp/regenerated.dlr

    # THIRD-PARTY-NOTICES asserts what a distributed copy contains. A
    # hand-kept one goes stale the moment a dependency moves, and a stale
    # notice is worse than none — so it is generated, and this fails if it
    # no longer matches what cargo resolved.
    - name: Check the third-party notices are up to date
      if: runner.os == 'Linux'
      run: scripts/third-party-notices.py --check

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: wasm

    # `wasm/` is its own workspace, so nothing above builds it. That is how a
    # change to `dealer-run`'s API reached `main` while the bindings that call
    # it no longer compiled: the root gate was green and had no reason not to
    # be. This job is what makes the two front ends fail together.
    - name: Check formatting
      working-directory: wasm
      run: cargo fmt --all -- --check

    - name: Run clippy
      working-directory: wasm
      run: cargo clippy --all-targets -- -D warnings

    # Host target, so the tests actually run — the wasm ones would need a
    # browser or Node, and these assert on what the engine did with the deals.
    - name: Run tests
      working-directory: wasm
      run: cargo test

    - name: Build for wasm32
      working-directory: wasm
      run: cargo build --target wasm32-unknown-unknown --release

    # The host tests above run the engine; these run the actual bindings and
    # compare them against the native CLI over the same deals. Nothing else
    # does: #65 changed what a seed means for a library, `verify.mjs` started
    # disagreeing with the CLI, and it reached main because no job ran it.
    - name: Install wasm-pack
      uses: jetli/wasm-pack-action@v0.4.0

    - name: Build the bindings for node
      working-directory: wasm
      run: ./build.sh nodejs

    # verify.mjs runs this against the bindings over the same deals, so the
    # comparison needs both halves built.
    - name: Build the command line to compare against
      run: cargo build --release --bin dealer

    - name: The bindings agree with the command line
      working-directory: wasm
      run: node verify.mjs

    - name: The library serves what it should
      working-directory: wasm
      run: node library-check.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

  check-licenses:
    name: Check Licenses
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Every remaining crate is dealer3's own work, so a blanket Unlicense check
    # is accurate. It was not while the workspace still contained gnurandom, whose
    # RNG derived from Berkeley random.c and carried a 1983 UC Regents notice that
    # this project had no standing to waive. That code now lives in
    # dealer-legacy-shuffle, which handles its attribution.
    - name: Verify all crates use Unlicense
      run: |
        echo "Checking license fields in Cargo.toml files..."
        for toml in */Cargo.toml; do
          if grep -q "license.*Unlicense" "$toml"; then
            echo "✓ $toml: Unlicense"
          elif grep -q "\[package\]" "$toml"; then
            echo "✗ $toml: Missing or incorrect license"
            exit 1
          fi
        done
        echo "All crates have correct license!"

  regression:
    name: Regression Tiers
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # Tier 1 replays deal sequences captured from dealer.exe and committed under
    # dealer/tests/corpus/. It never invokes dealer.exe itself.
    - name: Tier 1 - corpus replay vs dealer.exe
      run: cargo test -p dealer --test corpus_replay

    # Tier 2 pins dealer3's own output. A failure here means generation or
    # filtering changed, not that we disagree with dealer.exe.
    - name: Tier 2 - self-regression hashes
      run: cargo test -p dealer --test regression_hash

    - name: Verify legacy mode is gone
      run: |
        cargo build --release --bin dealer
        if cargo tree | grep -q gnurandom; then
          echo "gnurandom is still a dependency"
          exit 1
        fi
        # --legacy must report its removal rather than silently doing nothing
        if ./target/release/dealer --legacy -p 1 </dev/null; then
          echo "--legacy should exit non-zero"
          exit 1
        fi
        echo "legacy mode removed, gnurandom not in the dependency tree"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, wasm, lint, check-licenses, regression]

    steps:
    - name: Summary
      run: |
        echo "✅ All tests passed"
        echo "✅ All platforms (Linux, Windows, macOS) built successfully"
        echo "✅ Code formatting and linting passed"
        echo "✅ License compliance verified"
        echo "✅ Regression tiers passed"
