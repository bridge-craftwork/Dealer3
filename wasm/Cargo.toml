[package]
name = "dealer3-wasm"
version = "1.0.0"
edition = "2021"
license = "Unlicense"
description = "WebAssembly bindings for dealer3: bridge hand generation and constraint filtering in the browser"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Path deps: these bindings must always build against the adjacent source, never
# a published or pinned copy, so the engine and the site version together.
dealer-core = { path = "../dealer-core" }
dealer-parser = { path = "../dealer-parser" }
dealer-eval = { path = "../dealer-eval" }
dealer-pbn = { path = "../dealer-pbn" }
dealer-level = { path = "../dealer-level" }
dealer-run = { path = "../dealer-run" }

wasm-bindgen = "0.2"
# For a wall-clock reading: std::time::SystemTime::now() panics on
# wasm32-unknown-unknown. js_sys::Date works in both the browser and Node.
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

# Threads on the web. Optional because a threaded build is a different build:
# it needs nightly, `-Z build-std`, atomics, and a page served with COOP/COEP so
# `SharedArrayBuffer` exists. `./build.sh threaded` does all that; the ordinary
# build stays on stable and single-threaded, and both produce the same deals.
# Default features, not `no-bundler`: Vite *is* a bundler, and understands the
# `new Worker(new URL(...), { type: "module" })` the default emits. With
# `no-bundler` the pool's workers never started and nothing said so — the run
# simply produced nothing, with no error on the page or in the console.
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
default = []
parallel = ["dep:wasm-bindgen-rayon", "dealer-run/parallel"]

[profile.release]
# Size matters more than a few percent of speed for a page download.
opt-level = "z"
lto = true
codegen-units = 1
